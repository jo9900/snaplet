name: Stillmark
options:
  bundleIdPrefix: com.jo9900
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Stillmark:
    type: application
    platform: macOS
    sources:
      - Sources/Stillmark
      - Resources/Assets.xcassets
      - Resources/PrivacyInfo.xcprivacy
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Stillmark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 jo9900
        NSScreenCaptureUsageDescription: Stillmark captures the area you choose so you can annotate and save a screenshot.
    entitlements:
      path: Resources/Stillmark.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jo9900.Stillmark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
  StillmarkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/StillmarkTests
    dependencies:
      - target: Stillmark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jo9900.StillmarkTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stillmark.app/Contents/MacOS/Stillmark"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Stillmark:
    build:
      targets:
        Stillmark: all
        StillmarkTests: [test]
    test:
      targets:
        - StillmarkTests
      gatherCoverageData: true
